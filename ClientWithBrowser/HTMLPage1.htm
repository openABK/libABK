    /** Called each time the server issued one or more events
    @param objEvent The decoded event data the server sent
    */
    function OnLoggerEvent (objEvent)
    {
      var nList;

      if (objEvent.Events)
      {
        AddEventsToDump(objEvent.Events);
        for (var iterEvent in objEvent.Events)
        {
          ProcessEvent(objEvent.Events[iterEvent]);
        }

        // check for variable value limit alert
        for (var iterEvent in objEvent.Events)
        {
          var objAlert = objEvent.Events[iterEvent];
          if (objAlert.EventType == "LimitAlert")
          {
            AddAlert(objAlert);
          }
        }
      }

      if (objEvent.DataLists)
      {
        if (objEvent.DataLists.FirstList)
        {
          var nDataCount = objEvent.DataLists.FirstList.length;
          if (g_bStallValueList == false)
          {
            for (nVar = 0; nVar < nDataCount; nVar++)
            {
              var varValue = objEvent.DataLists.FirstList[nVar];
              varValue = varValue * g_arryMetaAll[nVar].Factor + g_arryMetaAll[nVar].Offset;
              tblVar.rows[nVar + 1].cells[1].innerHTML = varValue.toFixed(2);
            }
          }
          g_nTransfers += nDataCount;
        }
        if (objEvent.DataLists.LargeDisplayList)
        {
          var nDisplayCount = nLargeDisplayYCount * nLargeDisplayXCount;
          for (var nDisplay = 0; nDisplay < nDisplayCount; nDisplay++)
          {
            var varValue = objEvent.DataLists.LargeDisplayList[nDisplay];
            varValue = varValue * g_arryMetaLarge[nDisplay].Factor + g_arryMetaLarge[nDisplay].Offset;
            var cellValue = document.getElementById("largeValue" + nDisplay);
            cellValue.innerHTML = varValue.toFixed(2);
            cellValue.style.color = GetValueColor(varValue, g_arryMetaLarge[nDisplay].Thresholds);
          }
          g_nTransfers += nDisplayCount;
        }
        if (objEvent.DataLists.Trend1)
        {
          var nDataCount = objEvent.DataLists.Trend1.length;
          g_nTransfers += nDataCount;
          // var strVal1 = objEvent.DataLists.Trend1;
        }
      }
    }

    /** Formats an object to an html string
    @param obj Object structure to be dumped
    @param indent_level
    */
    function DumpObject (obj, indent_level)
    {
      var dumped_text = "";
      if (!indent_level)
        indent_level = 0;

      //The padding given at the beginning of the line.
      var level_padding = "";
      for (var j = 0; j < indent_level; j++)
        level_padding += ".&nbsp;&nbsp;&nbsp;";

      if (typeof (obj) == 'object')
      { //Array/Hashes/Objects
        for (var item in obj)
        {
          var value = obj[item];
          if (typeof (value) == 'object')
          { //If it is an array,
            dumped_text += level_padding + "[-" + item + "-] ...<br />";
            dumped_text += DumpObject(value, indent_level + 1);
          } else
          {
            dumped_text += level_padding + item + " : " + value + "<br />";
          }
        }
      } else
      { //Stings/Chars/Numbers etc.
        dumped_text = "===>" + obj + "<===(" + typeof (obj) + ")";
      }
      return dumped_text;
    }

    /** Retrieves the color out of a value and a color definition array
    @note There are six pre-defined colors for negative critical, negative marginal, normal-, normal+, positive marginal, positive critical
    @param dValue Value, which determines the color selection
    @param arryThresholds Array of value thresholds
    */
    function GetValueColor (dValue, arryThresholds)
    {
      var nThreshold;
      for (nThreshold = 0; nThreshold < 5; nThreshold++)
      {
        if (dValue < arryThresholds[nThreshold])
          break;
      }
      return colorValue[nThreshold];
    }


    /** Appends events to the appropriate document item
    @param objEvent Object which contains one or more events
    */
    function AddEventsToDump (objEvent)
    {
      var lstEvent = document.getElementById("eventdump");
      for (var iterEvent in objEvent)
      {
        var strDump = "";
        var nItem = 0;
        for (var item in objEvent[iterEvent])
        {
          var value = objEvent[iterEvent][item];
          if (nItem > 0)
            strDump += "   |   ";
          if (typeof (value) != 'object')
          {
            if ((typeof (value) == "string") && (item == "Time"))
            {
              value = AbkParseDate(value);
              strDump += value.getDate() + "." + (value.getMonth() + 1) + "., " + value.toTimeString().slice(0, 8);
            }
            else
            {
              strDump += /*item + ": " +*/value;
            }
          }
          nItem++;
        }
        lstEvent.add(new Option(strDump, 0), 0);
        if (lstEvent.options.length > 10)
          lstEvent.remove(10);
      }
    }

    /** Processes an event which was received from the server
    @param objEvent An herarchicaly structured object containing information about the server.
        The event also contains the informatin whether the client (this browser) is considered to be the primary client.
        A primay client is usually responsible for all user interactions while the non-primary ones are ment for simple data viewers.
    */
    function ProcessEvent (objEvent)
    {
      var bPrimary = false;
      if (objEvent.Role == "primary")
        bPrimary = true;
      switch (objEvent.EventType)
      {
        case "Button":
          if ((objEvent.Sender == g_nSessionId) || (bPrimary)) // only process my own button events of if i am the primary client
          {
            if (objEvent.StringParam == "Right" && objEvent.Param1 == 0)
            {
              var tab = document.getElementById("tabber0");
              kmrSimpleTabs.gotoNext(tab);
            }
            else if (objEvent.StringParam == "Left" && objEvent.Param1 == 0)
            {
              var tab = document.getElementById("tabber0");
              kmrSimpleTabs.gotoPrev(tab);
            }
          }
          break;
        case "MeasurementStopped":
          if (bPrimary)
            ShowRouteDialog();
          break;
        case "MeasurementStarted":
          if (bPrimary)
            ShowRouteDialog();
          break;
        case "Identify":
          ShowIdentification(objEvent.StringParam, true);
          break;
        case "AppChanged":
          window.location.reload();
          break;
        case "FormRequired":
          if (bPrimary)
            ShowForm(objEvent.StringParam);
          break;
        case "FormClose":
          if (bPrimary)
            HideForm(objEvent.StringParam);
          break;
      }
    }

    // see also http://www.bennadel.com/blog/1504-Ask-Ben-Parsing-CSV-Strings-With-Javascript-Exec-Regular-Expression-Command.htm
    // This will parse a delimited string into an array of arrays. The default delimiter is the comma, but this can be overriden in the second argument.
    function CSVToArray (strData, strDelimiter)
    {
      strDelimiter = (strDelimiter || ","); // Check to see if the delimiter is defined. If not, then default to comma.
      // Create a regular expression to parse the CSV values.
      var objPattern = new RegExp((/*Delimiters: */"(\\" + strDelimiter + "|\\r?\\n|\\r|^)" + /*Quoted fields: */"(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|" + /*Standard fields: */"([^\"\\" + strDelimiter + "\\r\\n]*))"), "gi");
      var arrData = [[]]; // Create an array to hold our data. Give the array a default empty first row.
      var arrMatches = null; // Create an array to hold our individual pattern matching groups.
      while (arrMatches = objPattern.exec(strData))
      { // Keep looping over the regular expression matches until we can no longer find a match.
        var strMatchedDelimiter = arrMatches[1]; // Get the delimiter that was found.
        // Check to see if the given delimiter has a length (is not the start of string) and if it matches field delimiter. If id does not, then we know that this delimiter is a row delimiter.
        if (strMatchedDelimiter.length && (strMatchedDelimiter != strDelimiter))
        {
          arrData.push([]); // Since we have reached a new row of data, add an empty row to our data array.
        }
        // Now that we have our delimiter out of the way, let's check to see which kind of value we captured (quoted or unquoted).
        if (arrMatches[2])
          var strMatchedValue = arrMatches[2].replace(new RegExp("\"\"", "g"), "\""); // We found a quoted value. When we capture this value, unescape any double quotes.
        else
          var strMatchedValue = arrMatches[3]; // We found a non-quoted value.
        arrData[arrData.length - 1].push(strMatchedValue); // Now that we have our value string, let's add it to the data array.
      }
      return (arrData);
    }

    function ShowAlerts ()
    {
      var divShader = document.getElementById('backshader');
      var nAlerts = g_arryAlert.length;
      if (nAlerts > 0)
      {
        divShader.style.display = "";
        var strInnterHtml = "";
        var nBox;
        for (nBox = 0; nBox < nAlerts; nBox++)
        {
          var objAlert = g_arryAlert[nBox];
          strInnterHtml += "<div id='alertbox" + nBox + "' class='alertbox' style='left:" + (nBox + 1) * 30 + "px; top:" + (nBox + 1) * 30 + "px;'>";
          strInnterHtml += "<u>" + objAlert.Message + "</u><br/>";

          if (objAlert.EventType == "LimitAlert")
          {
            var objAuxData = objAlert.AuxData;
            strInnterHtml += "Messstelle:" + objAuxData.Name + "<br/>Wert bei Überschreitung: " + objAuxData.Value + "<br/>";
            var VarValue = AbkGetVarValue(objAuxData.Name);
          }

          strInnterHtml += AbkParseDate(objAlert.Time);
          strInnterHtml += "<input id='AlertButtonConfirm' onclick='RemoveAlert(" + nBox + ")' type='button' value='Schließen' />";
          strInnterHtml += "&nbsp; &nbsp; &nbsp; &nbsp; <input type='checkbox' name='ckInhibit' onclick='InhibitAlert(" + nBox + ")' /> Nicht mehr anzeigen";
          strInnterHtml += "</div>";
        }
        divShader.innerHTML = strInnterHtml;
      }
      else
      {
        divShader.style.display = "none";
        divShader.innerHTML = "";
      }
    }

    function RemoveAlert (nIndex)
    {
      g_arryAlert.splice(nIndex, 1);
      ShowAlerts();
    }

    function InhibitAlert (nIndex)
    {
      var objAlert = g_arryAlert[nIndex];
      var strHash = objAlert.EventType + objAlert.strContext;
      g_SuppressedAlerts[strHash] = { nCounter: 0 };; // the not-show-state
    }

    function AlertMaintainPersistance ()
    {
      var nAlert;
      for (nAlert = 0; nAlert < g_arryAlert.length; nAlert++)
      {
        if (g_arryAlert[nAlert].nPersistance > 0)
        {
          g_arryAlert[nAlert].nPersistance--;
          if (g_arryAlert[nAlert].nPersistance == 0)
          {
            RemoveAlert(nAlert);
            nAlert--;
          }
        }
      }
    }

    function AlertSort (a, b)
    {
      return a.Severity - b.Severity;
    }

    function AddAlert (objAlert)
    {
      objAlert.nPersistance = -1; // default: infinite display of the alert
      objAlert.strContext = ""; // default context
      var bStackable = false; // default: when same alert type with same context, the alert will be suppressed
      var nDisplayCount = -1; // default: do not suppress, show alert infinite times
      var strSound = "Alert.wav";
      if (objAlert.EventType == "LimitAlert")
      {
        objAlert.Severity = 3;
        // objAlert.nPersistance = 3;
        nDisplayCount = 5; // show 5 times
        objAlert.Message = "Grenzwertüberschreitung";
        objAlert.AuxData = JSON.parse(objAlert.StringParam);
        objAlert.strContext = objAlert.AuxData.Name; // context, may prevent from double showing an alert the same time
      }

      var bSuppress = false; // true if alert shall be suppressed
      if (!bStackable)
      {
        var nAlert;
        for (nAlert = 0; nAlert < g_arryAlert.length; nAlert++)
        {
          if ((g_arryAlert[nAlert].strContext == objAlert.strContext) && (g_arryAlert[nAlert].EventType == objAlert.EventType))
          {
            bSuppress = true;
            break;
          }
        }
      }

      if (bSuppress == false)
      {
        // check for suppression of alert in the suppression list
        var strHash = objAlert.EventType + objAlert.strContext;
        if (g_SuppressedAlerts[strHash])
        { // if suppression info available
          var objSuppress = g_SuppressedAlerts[strHash];
          if (objSuppress.nCounter == 0)
          {
            bSuppress = true;
          }
          else if (objSuppress.nCounter > 0)
          {
            objSuppress.nCounter--;
          }
        }
        else
        {
          if (nDisplayCount >= 0)
          {
            g_SuppressedAlerts[strHash] = { nCounter: 5 };
            g_SuppressedAlerts[strHash].nCounter = nDisplayCount - 1;
          }
        }
      }

      if (bSuppress == false)
      {
        g_arryAlert.push(objAlert);
        if (strSound != "")
        {
          DHTMLSound(strSound);
        }
        g_arryAlert.sort(AlertSort); // sort according to severity
        ShowAlerts();
      }
    }

    // route dialog demo
    var g_idIntervalProgress = 0;
    var g_bTransferStarted = false;

    function ShowRouteDialog ()
    {
      var divDialog = document.getElementById('dialog');
      divDialog.style.display = "";
      var strInnterHtml;
      strInnterHtml = "<h2>Route input</h2><br/>";

      strInnterHtml += "<table border='0' cellpadding='5' cellspacing='0'>";
      strInnterHtml += "<tr><td>Route Selection:</td><td><select size='1' style='width: 200px' id='cbRoute' /></td></tr>";
      strInnterHtml += "<tr><td>Storage:</td><td><select size='1' style='width: 200px' id='cbStorage' /></td></tr>";
      strInnterHtml += "</table>";
      strInnterHtml += "<br/><span id='spanTransferStatus'>Please enter your route and select the storage location</span>";
      strInnterHtml += "<br/><br/><input id='TransferStart' onclick='StartDataTransfer()' type='button' value='Start' />";
      divDialog.innerHTML = strInnterHtml;

      // read Routes.txt and fill it to the combo
      xhrSend.open("GET", "Routes.txt", false);
      xhrSend.setRequestHeader("If-Modified-Since", new Date(0));
      xhrSend.send(); // JSON.stringify(objSend));
      if (xhrSend.readyState == 4 && xhrSend.status == 200)
      {
        var strRouteList = xhrSend.responseText;
        var objRoutes = CSVToArray(strRouteList);
        var cbRoute = document.getElementById("cbRoute");
        for (nRoute in objRoutes)
        {
          var strRoute = objRoutes[nRoute][0];
          var elOptNew = document.createElement('option');
          elOptNew.text = strRoute;
          elOptNew.value = strRoute;
          cbRoute.add(elOptNew, null);
        }

        // get the storage options
        var objStorage = AbkHttpPost("/abk/variables/mailbox_value", { GetList: ["StorageMedia"] });
        objStorage = CSVToArray(objStorage.Data[0]);
        var cbStorage = document.getElementById("cbStorage");
        for (nStorage in objStorage)
        {
          var strStorageKey = objStorage[nStorage][0];
          var strStorageText = objStorage[nStorage][1];
          var elOptNew = document.createElement('option');
          elOptNew.text = strStorageText;
          elOptNew.value = strStorageKey;
          cbStorage.add(elOptNew, null);
        }

        g_bTransferStarted = false;
        g_idIntervalProgress = window.setInterval("UpdateransferStatus()", 500);
      }
    }


    function StartDataTransfer ()
    {
      var cbStorage = document.getElementById("cbStorage");
      var cbRoute = document.getElementById("cbRoute");
      var btnTransfer = document.getElementById("TransferStart");
      var spanStatus = document.getElementById("spanTransferStatus");
      cbStorage.disabled = true;
      cbRoute.disabled = true;
      btnTransfer.disabled = true;
      spanStatus.innerHTML = "Übertragung wird gestartet...";

      // send event that user wants to start the data transfer
      var strRoute = cbRoute.options[cbRoute.options.selectedIndex].value;
      var strStorage = cbStorage.options[cbStorage.options.selectedIndex].value;
      var strEventInfo = JSON.stringify({ Route: strRoute, Storage: strStorage });
      AbkSendEvent("Custom_StartDataTransfer", strEventInfo, 1, 0, false);
    }

    function UpdateransferStatus ()
    {
      var spanStatus = document.getElementById("spanTransferStatus");
      var objTransfer = AbkHttpPost("/abk/variables/mailbox_value", { GetList: ["TransferProgress", "TransferStatus"] });
      var btnTransfer = document.getElementById("TransferStart");
      var nProgress = objTransfer.Data[0];
      var strStatus = objTransfer.Data[1];
      if (nProgress >= 0)
      {
        g_bTransferStarted = true;
        spanStatus.innerHTML = "Status: " + strStatus;
        btnTransfer.disabled = true;
      }
      if ((nProgress < 0) && (g_bTransferStarted)) // if transfer got completed
        HideRouteDialog();
    }

    function HideRouteDialog ()
    {
      var divDialog = document.getElementById('dialog');
      divDialog.style.display = "none";
      divDialog.innerHTML = "";
      window.clearInterval(g_idIntervalProgress);
    }
