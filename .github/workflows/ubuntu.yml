name: Linux
on:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libboost-all-dev libsoup-3.0-dev ninja-build
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build
        run: cmake -B build -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build && cmake --build build --target TestAbk
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/TestAbk